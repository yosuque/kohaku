name: Version
# Step one of the two-step release. Merged changesets accumulate into a "version packages" pull request;
# merging that pull request does NOT publish. Instead, this workflow notices the merge (no changesets
# left, and packages/spec-core's version has no tag yet) and creates a *draft* GitHub Release for it,
# with a body generated from the CHANGELOG sections Changesets just wrote. Publishing is the deliberate
# second step: a human publishes the draft, GitHub creates the tag, and release.yml publishes to npm and
# PyPI from that tag. Nothing here touches a registry.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-create a deleted draft, or re-open the version PR after fixing a CI problem

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push changeset-release/main; create the draft release
      pull-requests: write # open / update the version pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changeset status and the tag lookup below need history and tags
      # No `version:` input here: package.json's `packageManager` field is the single source of
      # truth for the pnpm version, and specifying both makes action-setup fail outright with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Version only. `publish-script` is deliberately absent: without it the action never publishes,
      # never pushes tags and never creates releases (its source returns right after reporting
      # `has-changesets` when there is nothing to version). The two inputs below are already inert
      # without a publish script; they are set anyway so nobody has to read the action's source to
      # know that tags come from publishing the draft release, not from here.
      # Requires Settings > Actions > General > "Allow GitHub Actions to create and approve pull
      # requests" (the run after PR #9 failed exactly there).
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-github-releases: false
          push-git-tags: false
      # "The version PR was just merged" has no event of its own, so it is derived: no changesets are
      # left on this commit, spec-core (the stand-in for the fixed group) carries a version that has no
      # tag and no release yet, and that version has a CHANGELOG section (proof it came from
      # `changeset version`, not a hand edit). Every check is a skip, not a failure: this step runs on
      # every push to main and must stay quiet on all of them.
      - id: detect
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/spec-core/package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          skip() { echo "::notice::$TAG: $1 — nothing to do"; echo "create=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            skip "tag already exists"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            skip "a release (draft or published) already exists"
          fi
          if npm view "@kohaku-ui/spec-core@$VERSION" version >/dev/null 2>&1; then
            skip "npm already has this version (released outside this workflow)"
          fi
          if ! grep -qx "## $VERSION" packages/spec-core/CHANGELOG.md 2>/dev/null; then
            skip "packages/spec-core/CHANGELOG.md has no '## $VERSION' section; the version was not produced by 'changeset version'"
          fi
          echo "create=true" >> "$GITHUB_OUTPUT"
      - name: Generate the release notes from the package CHANGELOGs
        if: steps.detect.outputs.create == 'true'
        run: node scripts/release-notes.mjs "${{ steps.detect.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
      # `--target` is this push's merge commit, so the tag GitHub creates on publish points at exactly
      # the tree the version PR produced, even if main moves on before anyone publishes.
      - name: Create the draft release
        if: steps.detect.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.detect.outputs.tag }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "${{ steps.detect.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Version"
            if [ "${{ steps.changesets.outputs.has-changesets }}" = "true" ]; then
              echo "- Changesets pending: version pull request #${{ steps.changesets.outputs.pr-number }} created or updated."
            elif [ "${{ steps.detect.outputs.create }}" = "true" ]; then
              echo "- Draft release **${{ steps.detect.outputs.tag }}** created: https://github.com/${{ github.repository }}/releases/tag/${{ steps.detect.outputs.tag }}"
              echo "- Next: run the dry run (Release workflow, dry_run=true), then publish the draft. See docs/runbooks/release.md."
            else
              echo "- No changesets pending and ${{ steps.detect.outputs.tag || 'the current version' }} is already tagged/released: nothing to do."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
