name: Release
# Step two of the two-step release: publish. Triggered by a human publishing the draft GitHub Release
# that version.yml created (GitHub creates the tag, then fires `release: published`), or by hand for a
# dry run / a re-run of a failed publish. The tag is the source of truth: everything is checked out
# from it and every version in the tree must equal it before anything is uploaded.
#
# The file name is load-bearing: PyPI's trusted publisher for kohaku-ui is registered against
# `release.yml` in environment `pypi`, and npm's trusted publishers for the twenty packages against
# `release.yml` in environment `npm`. Renaming this file means re-registering all of them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0). Required for a real publish. On a dry run, leave it empty to exercise the ref this run was started from (normally main, before the draft is published)."
        required: false
        type: string
      dry_run:
        description: "Run everything except the uploads to npm and PyPI"
        required: false
        type: boolean
        default: true

# One release at a time, and never cancel one in flight: a cancelled publish can leave some packages
# published at a version the others do not have.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves what this run is (which tag / ref, dry run or not), refuses to proceed for a tag without a
  # published release, and re-runs the full gate on the exact tree that will be published.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "release" ]; then
            TAG="$RELEASE_TAG"; DRY_RUN=false; REF="refs/tags/$TAG"
          else
            DRY_RUN="$INPUT_DRY_RUN"; TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              if [ "$DRY_RUN" != "true" ]; then
                echo "::error::A real publish needs the 'tag' input (e.g. v0.2.0)."; exit 1
              fi
              REF="$GITHUB_REF" # dry run against whatever this run was started from
            else
              if ! DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
                echo "::error::No GitHub release named $TAG. Releases are created as drafts by the Version workflow when the version pull request merges; publish the draft (which creates the tag), then this workflow runs by itself. See docs/runbooks/release.md."; exit 1
              fi
              if [ "$DRAFT" = "true" ]; then
                echo "::error::$TAG is still a draft, so the tag does not exist yet. Publish the draft to release it, or run a dry run without the 'tag' input."; exit 1
              fi
              REF="refs/tags/$TAG"
            fi
          fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Tag '$TAG' is not of the form vX.Y.Z."; exit 1; fi
          {
            echo "ref=$REF"; echo "tag=$TAG"; echo "version=${TAG#v}"; echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.ref }}
          fetch-depth: 0 # needed for the "tag is on main" check below
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag, all twenty manifests, and both places Python states its version must agree. CI's drift
      # check covers the Python side on every push; this is the last gate before an asymmetric release,
      # and the only place the tag itself is compared with the tree.
      - name: Assert the tag and every version in the tree agree
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          SPEC_CORE=$(node -p "require('./packages/spec-core/package.json').version")
          EXPECTED="${TAG#v}"; [ -n "$EXPECTED" ] || EXPECTED="$SPEC_CORE"
          echo "expected version: $EXPECTED (tag: ${TAG:-none, dry run on $GITHUB_REF})"
          FAIL=0
          for DIR in packages/* cli spec; do
            [ -f "$DIR/package.json" ] || continue
            node -e "const p=require('./$DIR/package.json'); if (p.publishConfig && p.version !== '$EXPECTED') { console.error('$DIR: ' + p.version); process.exit(1) }" || FAIL=1
          done
          PY=$(grep -m1 '^version' python/kohaku/pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          [ "$PY" = "$EXPECTED" ] || { echo "python/kohaku/pyproject.toml: $PY"; FAIL=1; }
          INIT=$(grep -m1 '^__version__' python/kohaku/src/kohaku/__init__.py | sed -E 's/.*"(.*)".*/\1/')
          [ "$INIT" = "$EXPECTED" ] || { echo "python/kohaku/src/kohaku/__init__.py: $INIT"; FAIL=1; }
          if [ -n "$TAG" ]; then
            git fetch --quiet origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not an ancestor of main"; FAIL=1; }
          fi
          [ "$FAIL" = "0" ] || { echo "::error::version mismatch — see above"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm test
      # The same gate the pack-smoke job runs on pull requests, repeated immediately before publishing:
      # this is the last point at which a broken tarball can still be stopped.
      - run: pnpm run smoke:pack

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted Publishing: npm authenticates this job by OIDC (repository + this file name + this
    # environment), so there is no npm token anywhere. pnpm does the token exchange itself: in GitHub
    # Actions it requests an ID token (audience npm:registry.npmjs.org), exchanges it at the registry's
    # /-/npm/v1/oidc/token/exchange/package/<name> endpoint, and uses the result in preference to any
    # static credential. If the exchange is refused (no trusted publisher registered for that package)
    # it logs "Skipped OIDC: ..." and falls back to static credentials -- which no longer exist here, so
    # the guard below turns that warning into a failure with a pointer to the checklist. `--provenance`
    # is explicit rather than left to pnpm's visibility probe so a missing attestation cannot slip
    # through silently. `pnpm publish` stays (not `npm publish`): only pnpm applies
    # publishConfig.exports, and every package's `exports` points at src/*.ts until then.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@kohaku-ui/spec-core/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No `registry-url` here: it would write an `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, and
      # pnpm refuses to start when that variable is unset. The default registry is npmjs.org anyway.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:dist
      # Dry run only: perform the OIDC exchange for every publishable package exactly the way pnpm does,
      # without publishing anything. This is the only way to find out, before the real run, whether all
      # twenty trusted publishers are registered -- a real run stops at the first package that is not.
      - name: Probe the npm trusted-publisher registration of every package (dry run only)
        if: needs.verify.outputs.dry_run == 'true'
        run: |
          ID_TOKEN=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          MISSING=0
          for DIR in packages/* cli spec; do
            NAME=$(node -p "const p=require('./$DIR/package.json'); p.publishConfig ? p.name : ''")
            [ -n "$NAME" ] || continue
            ENC=$(node -p "encodeURIComponent('$NAME')")
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" -H "Accept: application/json" -H "Content-Length: 0" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ENC")
            if [ "$STATUS" = "200" ]; then echo "ok       $NAME"; else echo "MISSING  $NAME (HTTP $STATUS)"; MISSING=1; fi
          done
          [ "$MISSING" = "0" ] || { echo "::error::Some packages have no npm trusted publisher for repository ${{ github.repository }}, workflow release.yml, environment npm. See docs/runbooks/release.md, 'npm trusted publishers'."; exit 1; }
      # pnpm skips any package whose version the registry already has ("pnpm will publish all the
      # packages that have versions not yet published to the registry"), so a re-run after a partial
      # failure publishes only what is missing, and a re-run with nothing missing is a no-op. That
      # per-package check is the right granularity; a job-level "is spec-core on npm?" gate would skip
      # the other nineteen after a failure that happened after spec-core went out.
      - name: Publish to npm
        env:
          DRY_RUN: ${{ needs.verify.outputs.dry_run }}
        run: |
          set -o pipefail
          FLAGS="--no-git-checks --provenance --report-summary"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          pnpm -r publish $FLAGS 2>&1 | tee "$RUNNER_TEMP/publish.log"
          if grep -q "Skipped OIDC" "$RUNNER_TEMP/publish.log"; then
            echo "::error::pnpm fell back from OIDC (see 'Skipped OIDC' above). There is no token fallback any more; fix the trusted-publisher registration and re-run."; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: npm-publish
          path: |
            pnpm-publish-summary.json
            ${{ runner.temp }}/publish.log
          if-no-files-found: ignore

  pypi:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing: PyPI authenticates this workflow in this environment by OIDC, so there is no
    # long-lived API token to store or rotate. Registered for release.yml + environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/kohaku-ui/${{ needs.verify.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.ref }}
      # setup-uv stopped publishing floating major/minor tags after v7 (no `@v10` ref exists), so the full
      # version tag is required here; Dependabot still bumps exact tags.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build --package kohaku-ui --out-dir dist
        working-directory: python
      # Proves the wheel is self-contained: the test suite reads spec/ from the monorepo root, so an
      # accidental runtime dependency on the repository layout would only show up here. Also the last
      # version check: the wheel must report the version that is about to be uploaded.
      - name: Import the built wheel in an isolated environment
        working-directory: python
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          GOT=$(uv run --isolated --no-project --with ./dist/*.whl python -c "import kohaku; from kohaku.registry import core_catalog; core_catalog(); print(kohaku.__version__)")
          echo "wheel reports $GOT"
          [ "$GOT" = "$VERSION" ] || { echo "::error::wheel version $GOT != $VERSION"; exit 1; }
      # pypa/gh-action-pypi-publish has no dry-run mode, so the upload is simply skipped on a dry run.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: needs.verify.outputs.dry_run != 'true'
        with:
          packages-dir: python/dist
          # A re-run after a partial failure must not fail on the upload that already succeeded.
          skip-existing: true

  summary:
    needs: [verify, npm, pypi]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publish
          path: npm-publish
        continue-on-error: true
      - env:
          VERSION: ${{ needs.verify.outputs.version }}
          DRY_RUN: ${{ needs.verify.outputs.dry_run }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          PYPI_RESULT: ${{ needs.pypi.result }}
          TAG: ${{ needs.verify.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          V="$VERSION"
          {
            if [ "$DRY_RUN" = "true" ]; then echo "## Dry run: $V (nothing uploaded)"; else echo "## Released $V"; fi
            echo
            echo "| step | result |"; echo "|---|---|"
            echo "| verify | $VERIFY_RESULT |"
            echo "| npm | $NPM_RESULT |"
            echo "| pypi | $PYPI_RESULT |"
            echo
            if [ -f npm-publish/pnpm-publish-summary.json ]; then
              echo "### npm packages handled by this run"
              node -e "const s=require('./npm-publish/pnpm-publish-summary.json'); for (const p of (s.publishedPackages||[])) console.log('- ' + p.name + '@' + p.version)"
            fi
            echo
            echo "- npm: https://www.npmjs.com/package/@kohaku-ui/spec-core/v/$V"
            echo "- PyPI: https://pypi.org/project/kohaku-ui/$V/"
            [ -n "$TAG" ] && echo "- GitHub release: https://github.com/$REPOSITORY/releases/tag/$TAG"
            echo
            echo "Re-run a failed publish: Actions > Release > Run workflow, tag=$TAG, dry_run=false (docs/runbooks/release.md)."
          } >> "$GITHUB_STEP_SUMMARY"
