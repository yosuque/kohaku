name: Release
# Changesets drives this: merged changesets accumulate into a release pull request, and merging that pull
# request is what publishes. Nothing is released from a developer's machine, and the version bump for all
# twenty npm packages plus the Python distribution is reviewed as one diff before anything goes out.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-run, for when a publish fails partway

# One release at a time, and never cancel one in flight: a cancelled publish can leave some packages
# published at a version the others do not have.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release pull request, tag and GitHub release
      pull-requests: write
      id-token: write # npm provenance attestation
    outputs:
      published: ${{ steps.npm.outputs.published }}
      version: ${{ steps.npm.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No `version:` input here: package.json's `packageManager` field is the single source of
      # truth for the pnpm version, and specifying both makes action-setup fail outright with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The same gate the pack-smoke job runs on pull requests, repeated immediately before publishing:
      # this is the last point at which a broken tarball can still be stopped.
      - run: pnpm run smoke:pack
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Does NOT currently produce an attestation: 0.1.0 went out with registry signatures but no
          # provenance. `pnpm publish` turned out not to delegate to the npm CLI -- it uploads itself and
          # never reads this -- so the variable is inert here, and the run logged "Skipped OIDC:
          # ERR_PNPM_AUTH_TOKEN_EXCHANGE" for every package. Kept because it costs nothing and becomes live
          # the moment publishing moves to the npm CLI; getting provenance back is a separate change.
          NPM_CONFIG_PROVENANCE: "true"
      # Ask the registry, rather than trusting changesets/action's own `published` output: that output is
      # derived by parsing `changeset publish`'s log lines, and this repository publishes with
      # `pnpm -r publish`, whose output it cannot parse. It therefore reported false even after all twenty
      # packages went out, which silently skipped the PyPI and GitHub Release jobs below. The registry is
      # the only thing that actually knows, and asking it also makes a re-run converge: whatever npm is
      # missing gets published, and the downstream jobs run whenever npm is at this version.
      #
      # npm alone is not enough to gate on, though: once npm has a version, that stays true on every later
      # workflow run too (every subsequent push to main), which would otherwise re-run the PyPI / GitHub
      # Release jobs forever even after both already have this version. Those two jobs are individually
      # idempotent (skip-existing / "release already exists"), but there is no reason to run them at all
      # once there is nothing left to do — so also check whether the GitHub release or the PyPI upload is
      # still missing, and only report published when npm has it AND at least one of the other two does not.
      - id: npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/spec-core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! npm view "@kohaku-ui/spec-core@$VERSION" version >/dev/null 2>&1; then
            echo "npm does not have $VERSION"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "npm is at $VERSION"
          GH_HAS=false
          if gh release view "v$VERSION" >/dev/null 2>&1; then GH_HAS=true; fi
          PYPI_HAS=false
          if curl -fsS "https://pypi.org/simple/kohaku-ui/" 2>/dev/null | grep -qF "$VERSION"; then PYPI_HAS=true; fi
          if [ "$GH_HAS" = "true" ] && [ "$PYPI_HAS" = "true" ]; then
            echo "the GitHub release and PyPI both already have $VERSION; nothing left to do"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  pypi:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing: PyPI authenticates this workflow in this environment by OIDC, so there is no
    # long-lived API token to store or rotate.
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Pin to the exact commit that triggered this run, not the branch tip: by the time this job runs,
      # main may have moved on to a later commit (a subsequent push), and checking that out could publish
      # code that does not match the npm version this job just asserted against.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # setup-uv stopped publishing floating major/minor tags after v7 (no `@v10` ref exists), so the full
      # version tag is required here; Dependabot still bumps exact tags.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      # CI already fails on version drift, but this is the last gate before an asymmetric release: npm is
      # already published at this point, and a mismatched PyPI version cannot be taken back.
      - name: Assert the Python version matches the published npm version
        run: |
          PY=$(grep -m1 '^version' python/kohaku/pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$PY" != "${{ needs.release.outputs.version }}" ]; then
            echo "python $PY != npm ${{ needs.release.outputs.version }}"
            exit 1
          fi
      - run: uv build --package kohaku-ui --out-dir dist
        working-directory: python
      # Proves the wheel is self-contained: the test suite reads spec/ from the monorepo root, so an
      # accidental runtime dependency on the repository layout would only show up here.
      - name: Import the built wheel in an isolated environment
        run: uv run --isolated --no-project --with ./dist/*.whl python -c "import kohaku; print(kohaku.__version__)"
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # The gate above is "npm is at this version", which stays true on every later run. PyPI refuses a
          # re-upload of a version it already has, so without this a re-run would fail on work already done.
          skip-existing: true

  github-release:
    needs: [release, pypi]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Idempotent for the same reason the PyPI upload is: the gate stays true once npm is at this version,
      # so a re-run must leave an existing release alone rather than fail on "already exists".
      - run: |
          TAG="v${{ needs.release.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
