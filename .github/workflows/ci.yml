name: CI
on:
  push:
    branches: [main]
  pull_request:
# No job below needs write access (checkout, dependency install, test, artifact upload only), so pin the
# token to read-only explicitly — this also applies to pull_request runs from forks.
permissions:
  contents: read
# A newer push to the same PR supersedes the run in flight; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # package.json's engines.node floor (">=22") is only actually exercised if something in CI runs on
        # it. 24 stays the primary version (it is also what conformance-ts / conformance-python / python
        # run on), 22 proves the declared floor still works. Steps that must run exactly once (coverage
        # upload, the generated-artefact drift checks) are gated to the 24 leg below so the matrix does not
        # duplicate or race them.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` input here: package.json's `packageManager` field is the single source of
      # truth for the pnpm version, and specifying both makes action-setup fail outright with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placed before the test suite so a formatting or lint slip is reported in well under a minute
      # instead of after the full run. Gated to one matrix leg like the steps at the bottom of this job:
      # Biome ships its own binary and never reads the Node version, so the result is identical on 22 and
      # 24. --error-on-warnings makes biome.jsonc the single source of truth for what blocks CI -- anything
      # that should not block is set to "info" or "off" there, with its measured count and reason, rather
      # than relying on Biome's shipped severities.
      - name: Format & lint (Biome)
        if: matrix.node-version == 24
        run: pnpm biome ci --error-on-warnings --reporter=github .
      # Report-only: the remaining high-severity findings come from transitive dependencies of jsdom, the MCP SDK,
      # and the sample web app, not from any published package's own runtime dependencies. Kept non-blocking until
      # upstream fixes land; still visible in the job log for tracking.
      - name: Production dependency audit (report only)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      # One run of the suite per leg: the 24 leg runs it under coverage (the thresholds in
      # vitest.config.ts are the gate), the 22 leg runs it plain to prove the declared Node floor.
      - name: Test (with coverage on the primary leg)
        run: ${{ matrix.node-version == 24 && 'pnpm test:coverage' || 'pnpm test' }}
      - run: pnpm typecheck
      - run: node cli/bin/kohaku.js conformance --self
      # Everything below this line must run exactly once per CI run (a coverage upload artifact name
      # collision, or two legs racing to write/verify the same generated files), so it is gated to a single
      # matrix leg rather than duplicated across node-version 22 and 24.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == 24
        with:
          name: coverage
          path: coverage/
      - name: JSON Schema drift check
        if: matrix.node-version == 24
        run: |
          pnpm --filter @kohaku-ui/spec run generate-schemas
          git diff --exit-code -- spec/schemas
      - name: Facet descriptor (facet-views.json) drift check
        if: matrix.node-version == 24
        run: |
          pnpm intents:emit
          git diff --exit-code -- apps/sample-web/src/generated/facet-views.json
      - name: Deterministic seed drift check
        if: matrix.node-version == 24
        run: |
          pnpm seed
          git diff --exit-code -- apps/sample-api/src/domain/seed
      - name: Cross-language fixture drift check
        if: matrix.node-version == 24
        run: |
          pnpm --filter @kohaku-ui/spec run generate-cross-language-fixtures
          git diff --exit-code -- spec/test/fixtures
      - name: Core catalog JSON (export for Python) drift check
        if: matrix.node-version == 24
        run: |
          pnpm --filter @kohaku-ui/registry run export-core-catalog
          git diff --exit-code -- python/kohaku/src/kohaku/registry/_data
      # The publishing metadata (publishConfig.exports above all) is derived from each package's own
      # exports, so it can go stale the moment a subpath is added -- and nothing local would notice,
      # because the workspace never reads publishConfig.
      - name: Package manifest metadata drift check
        if: matrix.node-version == 24
        run: |
          pnpm meta:sync
          git diff --exit-code -- packages cli spec
      # The two implementations are one protocol implemented twice and are checked against each other, so
      # a given version has to mean the same behaviour in either language. Changesets owns the TypeScript
      # version; this fails if the Python distribution has drifted from it.
      - name: TypeScript/Python version sync drift check
        if: matrix.node-version == 24
        run: |
          pnpm python:version
          git diff --exit-code -- python/kohaku/pyproject.toml python/kohaku/src/kohaku/__init__.py
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: matrix.node-version == 24
        with:
          enable-cache: true
      # Report-only static analysis of the workflows themselves (template injection, unpinned actions,
      # excessive permissions). Same stance as the dependency audit: visible, not yet blocking.
      # Pinned to an exact version for the same reason the actions above are pinned to a commit SHA
      # (reproducible, tamper-resistant CI); Dependabot does not track uvx-invoked tools, so this pin
      # is a manual bump.
      - name: Workflow lint (zizmor, report only)
        if: matrix.node-version == 24
        run: uvx zizmor@1.30.1 --format plain .github/workflows
        continue-on-error: true
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-uv stopped publishing floating major/minor tags after v7 (no `@v10` ref exists), so the full
      # version tag is required here; Dependabot still bumps exact tags.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
  # Conformance black-box check against the TS host itself (previously only exercised in-process by
  # spec/test/conformance.test.ts; this additionally proves the compiled CLI against a real running server, the
  # same way conformance-python below proves the Python port). No LLM key is configured, so the default `claude`
  # provider only warns at startup (KOHAKU_LLM_STRUCTURED_MODE etc. never engage); the checked Intent
  # (sales.quarterly_summary) is served by the L0 fixed path and never calls the LLM.
  conformance-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start TS sample-api and run REST black-box check
        run: |
          LOG=$(mktemp)
          (KOHAKU_DATA_DIR=$(mktemp -d) PORT=8787 pnpm --filter @kohaku-ui-sample/api start) >"$LOG" 2>&1 &
          SERVER_PID=$!
          # Always stop the server regardless of the conformance outcome (cleanup).
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          scripts/wait-for-http.sh http://localhost:8787/api/kohaku/catalog 30 "$LOG"
          node cli/bin/kohaku.js conformance --rest http://localhost:8787/api/kohaku
  # Conformance black-box check against the Python host (guarantees cross-implementation spec conformance in CI).
  # The LLM uses the example (sales-api) deterministic pseudo-LLM (KOHAKU_LLM_PROVIDER=fake by default); no real LLM required.
  conformance-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: python
      # The L2 JS sidecar live test requires Node+CLI. The python job has no Node and always skips it, so we run it
      # as required in conformance-python, which already has Node+pnpm+uv (this costs less CI time and fewer
      # duplicate installs than adding setup-node to the pytest job).
      - name: L2 JS sidecar live test (requires Node)
        run: KOHAKU_REQUIRE_NODE_SIDECAR=1 uv run pytest kohaku/tests/composer/test_l2_js_sidecar.py kohaku/tests/composer/test_compose.py::TestComposeL2::test_l2_script_syntax_repair_via_sidecar -q
        working-directory: python
      - name: Start Python sales-api and run REST black-box check
        run: |
          LOG=$(mktemp)
          (cd python && KOHAKU_DATA_DIR=$(mktemp -d) PORT=8790 uv run python -m sales_api) >"$LOG" 2>&1 &
          SERVER_PID=$!
          # Always stop the server regardless of the conformance outcome (cleanup).
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          scripts/wait-for-http.sh http://localhost:8790/api/kohaku/catalog 30 "$LOG"
          node cli/bin/kohaku.js conformance --rest http://localhost:8790/api/kohaku
  # Reports whether a pull request carries a changeset, without blocking on it: documentation, CI and
  # internal-tooling changes legitimately have none, and a hard gate on those would only teach people to
  # write empty changesets. Same report-only stance as the dependency audit above. Tighten it once the
  # release cadence has settled.
  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"
        continue-on-error: true
  # The three production adapters against real backends. Locally these suites skip without Docker / a URL
  # (see @kohaku-ui/port-contracts' resolveAdapterBackend); here the backends run as job services and
  # KOHAKU_ADAPTER_TESTS=require turns a skip into a failure, so this job can never pass vacuously.
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KOHAKU_ADAPTER_TESTS: require
      KOHAKU_TEST_REDIS_URL: redis://localhost:6379
      KOHAKU_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project storage-redis --project storage-postgres --project authz-jwt --project sample-api
  # REST black-box conformance with each production storage backend behind the TS sample host (the same
  # check conformance-ts runs against the file port), so a backend-specific deviation in the Spec cache /
  # lineage / fixation path is caught by the spec suite, not only by the contract tests.
  conformance-ts-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        storage: [redis, postgres]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start TS sample-api on ${{ matrix.storage }} and run the REST black-box check
        env:
          KOHAKU_STORAGE: ${{ matrix.storage }}
          KOHAKU_REDIS_URL: redis://localhost:6379
          KOHAKU_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          # A redis/postgres backend requires a real capability secret (sample-api's from-env refuses to
          # start on the fixed demo default once storage leaves the single-process file/hmac shape) — this
          # is a CI-only value, never used outside this ephemeral job.
          KOHAKU_CAPABILITY_SECRET: ci-conformance-adapters-test-secret-not-for-production-use
        run: |
          LOG=$(mktemp)
          (KOHAKU_DATA_DIR=$(mktemp -d) PORT=8787 pnpm --filter @kohaku-ui-sample/api start) >"$LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          scripts/wait-for-http.sh http://localhost:8787/api/kohaku/catalog 30 "$LOG"
          node cli/bin/kohaku.js conformance --rest http://localhost:8787/api/kohaku
  # The `ci` job above typechecks and tests against `src/*.ts` directly (packages export source; publishConfig
  # only applies once a package is packed). That means nothing in `ci` ever notices a missing publishConfig
  # entry, a `.d.ts` that stops resolving once packed, or a guest closure (packages/sandbox) whose stringified
  # source changes shape under the build. A separate job rather than an extra step in `ci`, for two reasons:
  # it does its own `pnpm pack` + a plain `npm install` of the tarballs outside the workspace, which is a
  # meaningfully different (slower) install path than the rest of `ci`'s single `pnpm install --frozen-lockfile`,
  # and -- like every other job here -- it never calls an LLM, so it should not share a job with steps that
  # might one day gain a real one.
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke:pack
  # The documentation site is generated from docs/ at build time (apps/docs-site/scripts/sync-docs.ts) into a
  # gitignored directory, so "drift" here means two things: the site must still build from the Markdown as
  # committed (dead links, broken frontmatter), and the build must leave the checkout untouched (nothing
  # generated may be tracked or hand-edited). The sidebar <-> page, snippet <-> Markdown, and (per GitHub's
  # own heading-slug rule) anchor-link resolution checks all run in `ci` as ordinary Vitest tests
  # (apps/docs-site/test). A separate job rather than a step in `ci`, because VitePress brings its own Vite
  # and Vue and is slower to install than anything `ci` needs.
  docs-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - name: Generated-output drift check (the build must not touch the checkout)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: apps/docs-site/dist/
