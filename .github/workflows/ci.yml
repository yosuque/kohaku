name: CI
on:
  push:
    branches: [main]
  pull_request:
# No job below needs write access (checkout, dependency install, test, artifact upload only), so pin the
# token to read-only explicitly — this also applies to pull_request runs from forks.
permissions:
  contents: read
# A newer push to the same PR supersedes the run in flight; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# One runtime version per language, and it is the declared floor (CONTRIBUTING.md §2): Node comes from
# `.node-version` (every setup-node below uses node-version-file, and engines.node is generated from the same
# file), Python is this value (= requires-python's floor in python/*/pyproject.toml).
env:
  PYTHON_VERSION: "3.13"
jobs:
  # The TypeScript test suite, and nothing else: this job is the critical path of the whole workflow (its test
  # step alone outlasts every other job), so everything that does not need the test run -- lint, typecheck, the
  # generator drift checks -- lives in `static` below and runs alongside it instead of after it.
  # MEASUREMENT ONLY (never merge): the same test step nine times in one run, so every variant sees the same
  # commit and the same time of day. default-* = Vitest's own worker count (CPUs - 1), w4-* = VITEST_MAX_WORKERS=4,
  # debug = testcontainers' debug log (where the ~22 s before the first test result goes), prepull-* = the three
  # images testcontainers needs are pulled in the background while the job sets itself up.
  ci:
    name: ci (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default-1 }
          - { name: default-2 }
          - { name: default-3 }
          - { name: w4-1, workers: "4" }
          - { name: w4-2, workers: "4" }
          - { name: w4-3, workers: "4" }
          - { name: debug, debug: "testcontainers*" }
          - { name: prepull-1, prepull: true }
          - { name: prepull-2, prepull: true }
    steps:
      - name: Pre-pull the adapter images in the background (measurement only)
        if: matrix.prepull
        run: |
          for image in postgres:16-alpine redis:7-alpine testcontainers/ryuk:0.14.0; do
            nohup bash -c 'date +%T.%N; time docker pull -q "$0"; date +%T.%N' "$image" \
              > "/tmp/pull-$(echo "$image" | tr '/:' '__').log" 2>&1 &
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` input here: package.json's `packageManager` field is the single source of
      # truth for the pnpm version, and specifying both makes action-setup fail outright with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The thresholds in vitest.config.ts are the gate. The Redis / Postgres adapter suites run here too, under
      # the default resolution (env URL -> Docker -> skip; on the runner that is testcontainers), even though the
      # `integration` job runs them again against service containers with KOHAKU_ADAPTER_TESTS=require:
      # `coverage.include` counts storage-postgres / storage-redis src toward the global thresholds, and without
      # the adapter suites the functions figure drops from ~89% to ~87% and fails the 88% floor.
      - name: Test (with coverage)
        run: pnpm test:coverage
        env:
          VITEST_MAX_WORKERS: ${{ matrix.workers }}
          DEBUG: ${{ matrix.debug }}
      - name: Runner facts (measurement only)
        if: always()
        run: |
          echo "nproc=$(nproc)"; free -m | sed -n '1,2p'
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          for f in /tmp/pull-*.log; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.name == 'default-1'
        with:
          name: coverage
          path: coverage/
  # Source-level checks that need neither the test run nor build output: formatting / lint, the per-package
  # typecheck, the spec self-check, and every "regenerate and diff" check for a committed generated file. They
  # used to run inside `ci` after the test step, where a type error or a stale generated file was reported only
  # once the ~3-minute test run had finished; here they report within the first minute and off the critical path.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every git command below is a local `git diff`; nothing needs an authenticated remote, so do not
          # leave the token in .git/config (zizmor: artipacked, same as the `build` job).
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # First, so a formatting or lint slip is the earliest thing this workflow reports. --error-on-warnings makes
      # biome.jsonc the single source of truth for what blocks CI -- anything that should not block is set to
      # "info" or "off" there, with its measured count and reason, rather than relying on Biome's shipped severities.
      - name: Format & lint (Biome)
        run: pnpm biome ci --error-on-warnings --reporter=github .
      # Report-only: the remaining high-severity findings come from transitive dependencies of jsdom, the MCP SDK,
      # and the sample web app, not from any published package's own runtime dependencies. Kept non-blocking until
      # upstream fixes land; still visible in the job log for tracking.
      - name: Production dependency audit (report only)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - run: pnpm typecheck
      - run: node cli/bin/kohaku.js conformance --self
      - name: JSON Schema drift check
        run: |
          pnpm --filter @kohaku-ui/spec run generate-schemas
          git diff --exit-code -- spec/schemas
      - name: Facet descriptor (facet-views.json) drift check
        run: |
          pnpm intents:emit
          git diff --exit-code -- apps/sample-web/src/generated/facet-views.json
      - name: Deterministic seed drift check
        run: |
          pnpm seed
          git diff --exit-code -- apps/sample-api/src/domain/seed
      - name: Cross-language fixture drift check
        run: |
          pnpm --filter @kohaku-ui/spec run generate-cross-language-fixtures
          git diff --exit-code -- spec/test/fixtures
      - name: Core catalog JSON (export for Python) drift check
        run: |
          pnpm --filter @kohaku-ui/registry run export-core-catalog
          git diff --exit-code -- python/kohaku/src/kohaku/registry/_data
      # The publishing metadata (publishConfig.exports above all) is derived from each package's own
      # exports, so it can go stale the moment a subpath is added -- and nothing local would notice,
      # because the workspace never reads publishConfig. engines.node (published packages and the root
      # manifest) is derived from `.node-version`.
      - name: Package manifest metadata drift check
        run: |
          pnpm meta:sync
          git diff --exit-code -- packages cli spec package.json
      # `kohaku init` pins a projection of the pnpm catalog plus the Node floor (cli/src/init/versions.ts);
      # without this check a catalog bump (Dependabot's included) or a `.node-version` change leaves the table
      # stale and the render test red.
      - name: Init version table drift
        run: |
          pnpm init:versions
          git diff --exit-code -- cli/src/init/versions.ts
      # The two implementations are one protocol implemented twice and are checked against each other, so
      # a given version has to mean the same behaviour in either language. Changesets owns the TypeScript
      # version; this fails if the Python distribution has drifted from it.
      - name: TypeScript/Python version sync drift check
        run: |
          pnpm python:version
          git diff --exit-code -- python/kohaku/pyproject.toml python/kohaku/src/kohaku/__init__.py python/uv.lock
      # Only here for `uvx zizmor` below, so no cache: with caching on, setup-uv hashes its default
      # `**/pyproject.toml` / `**/uv.lock` / ... globs to build the key, and after `pnpm install` that walk
      # descends into node_modules and took ~8 minutes of an ~11-minute job (measured when this step still lived in
      # `ci`; `static` installs the same workspace). It must be an explicit `false`:
      # since v10 the default is `auto`, which enables the cache on GitHub-hosted runners.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Report-only static analysis of the workflows themselves (template injection, unpinned actions,
      # excessive permissions). Same stance as the dependency audit: visible, not yet blocking.
      # Pinned to an exact version for the same reason the actions above are pinned to a commit SHA
      # (reproducible, tamper-resistant CI); Dependabot does not track uvx-invoked tools, so this pin
      # is a manual bump.
      - name: Workflow lint (zizmor, report only)
        run: uvx zizmor@1.30.1 --format plain .github/workflows
        continue-on-error: true
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-uv stopped publishing floating major/minor tags after v7 (no `@v10` ref exists), so the full
      # version tag is required here; Dependabot still bumps exact tags.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          # uv.lock alone determines the environment; the default globs walk the whole checkout.
          cache-dependency-glob: python/uv.lock
      # `uv sync --frozen` installs from uv.lock without checking it against the pyproject files, so a stale
      # lock (e.g. a version bump without re-locking) would otherwise pass silently. Fail on it instead.
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # The Redis / Postgres adapter suites need a backend; the `integration` job below runs them against
      # real service containers with KOHAKU_ADAPTER_TESTS=require, so this job skips them (`skip` short-circuits the
      # backend resolution in kohaku/tests/storage/_backend.py) rather than start testcontainers a second time.
      - run: uv run pytest
        env:
          KOHAKU_ADAPTER_TESTS: skip
  # Everything that needs a real Redis / Postgres, in one job against one pair of job services (formerly the
  # `adapters` job plus the six-leg `conformance-ts` / `conformance-python` matrices, whose legs spent ~20-50s on
  # runner and container setup to run a ~3s check each).
  #
  # 1. The production adapters, in both languages. Locally these suites skip without Docker / a URL (see
  #    @kohaku-ui/port-contracts' resolveAdapterBackend and kohaku/tests/storage/_backend.py); here
  #    KOHAKU_ADAPTER_TESTS=require turns a skip into a failure, so this job can never pass vacuously. It runs the
  #    TS suites, the Python storage suites (kohaku.storage.redis / .postgres against the same services), and the
  #    cross-language tests: each storage-redis / storage-postgres python-interop test starts the Python adapter
  #    (python/.venv, hence the uv sync before the vitest step) against the same backend, writes with one language
  #    and compare-and-sets with the other.
  # 2. The REST black-box conformance check against each sample host (TS sample-api, Python sales-api) on each
  #    storage backend behind it: `file` (the samples' default port) proves the CLI against a real running server;
  #    `redis` / `postgres` catch a backend-specific deviation in the Spec cache / lineage / fixation path through
  #    the spec suite, not only through the contract tests. scripts/ci-conformance.sh gives every (host, storage)
  #    pair its own Redis key prefix and Postgres schema, so no leg sees what another one, or step 1, left behind.
  #    No LLM key is configured: the TS host's default `claude` provider only warns at startup and the checked
  #    Intent (sales.quarterly_summary) is served by the L0 fixed path; the Python sample defaults to its
  #    deterministic pseudo-LLM (KOHAKU_LLM_PROVIDER=fake).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KOHAKU_ADAPTER_TESTS: require
      KOHAKU_TEST_REDIS_URL: redis://localhost:6379
      KOHAKU_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      KOHAKU_REDIS_URL: redis://localhost:6379
      KOHAKU_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          # Must stay scoped: the default globs (**/pyproject.toml, **/uv.lock, ...) are walked after
          # `pnpm install` above, i.e. through node_modules, which once took ~7 minutes of a ~7.5-minute job.
          cache-dependency-glob: python/uv.lock
      - run: uv sync --frozen
        working-directory: python
      - name: Adapter suites (TS + cross-language interop)
        run: pnpm vitest run --project storage-redis --project storage-postgres --project authz-jwt --project sample-api
      - name: Adapter suites (Python)
        run: uv run pytest kohaku/tests/storage -q
        working-directory: python
      # The L2 JS sidecar live test requires Node+CLI. The python job has no Node and always skips it, so it runs
      # here, where Node+pnpm+uv are already installed (cheaper than adding setup-node to the pytest job).
      - name: L2 JS sidecar live test (requires Node)
        run: KOHAKU_REQUIRE_NODE_SIDECAR=1 uv run pytest kohaku/tests/composer/test_l2_js_sidecar.py kohaku/tests/composer/test_compose.py::TestComposeL2::test_l2_script_syntax_repair_via_sidecar -q
        working-directory: python
      # One step per (host, storage) pair so a failure names its leg. `if: !cancelled()` keeps the remaining legs
      # running after one fails, the way the former matrices (one job per leg) reported every leg.
      - name: Conformance — TS host, file
        if: ${{ !cancelled() }}
        run: scripts/ci-conformance.sh ts file
      - name: Conformance — TS host, redis
        if: ${{ !cancelled() }}
        run: scripts/ci-conformance.sh ts redis
      - name: Conformance — TS host, postgres
        if: ${{ !cancelled() }}
        run: scripts/ci-conformance.sh ts postgres
      - name: Conformance — Python host, file
        if: ${{ !cancelled() }}
        run: scripts/ci-conformance.sh python file
      - name: Conformance — Python host, redis
        if: ${{ !cancelled() }}
        run: scripts/ci-conformance.sh python redis
      - name: Conformance — Python host, postgres
        if: ${{ !cancelled() }}
        run: scripts/ci-conformance.sh python postgres
  # Build-and-package checks that look at build output rather than source (formerly the `pack-smoke` and
  # `docs-site` jobs, plus the report-only `changeset-check` job; `pnpm install` restores from the pnpm cache in
  # seconds, so a separate runner per check bought nothing but setup time).
  #
  # - pack-smoke: the `ci` and `static` jobs test and typecheck against `src/*.ts` directly (packages export source;
  #   publishConfig only applies once a package is packed), so nothing there notices a missing publishConfig
  #   entry, a `.d.ts` that stops resolving once packed, or a guest closure (packages/sandbox) whose stringified
  #   source changes shape under the build. `pnpm run smoke:pack` packs every package and does a plain
  #   `npm install` of the tarballs outside the workspace.
  # - docs-site: the documentation site is generated from docs/ at build time (apps/docs-site/scripts/sync-docs.ts)
  #   into a gitignored directory, so "drift" here means two things: the site must still build from the Markdown
  #   as committed (dead links, broken frontmatter), and the build must leave the checkout untouched (nothing
  #   generated may be tracked or hand-edited). The sidebar <-> page, snippet <-> Markdown, and (per GitHub's own
  #   heading-slug rule) anchor-link resolution checks all run in `ci` as ordinary Vitest tests (apps/docs-site/test).
  # - The static playground (design.md decision 57) in strict mode (forbidNodeBuiltins' default), the same build a
  #   Pages deploy would run -- proves it stays Node-dependency-free and buildable on every push, independent of
  #   whether Pages is ever actually enabled (see pages.yml, workflow_dispatch-only and not wired up yet). The
  #   playground fixture replay (`pnpm vitest run --project playground-drift`) is not run here: no fixture has been
  #   recorded yet (docs/user-guide.md §10), so it would check nothing; pages.yml runs it, blocking, before a deploy.
  # - A changeset report: whether a pull request carries a changeset, without blocking on it -- documentation, CI
  #   and internal-tooling changes legitimately have none, and a hard gate on those would only teach people to
  #   write empty changesets. Tighten it once the release cadence has settled.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `changeset status --since` needs the base branch's history
          # This job uploads an artifact and nothing after the checkout needs an authenticated git remote, so
          # the token is not left in .git/config (zizmor: artipacked).
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Changeset report (report only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"
        continue-on-error: true
      - run: pnpm docs:build
      - name: Generated-output drift check (the docs build must not touch the checkout)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: apps/docs-site/dist/
      - name: Playground build (strict mode — must have zero Node-only imports)
        run: pnpm --filter @kohaku-ui-sample/playground run build
      - name: Pack smoke (pack every package and verify the tarballs outside the workspace)
        run: pnpm run smoke:pack
  # The single required status check for this workflow (the main ruleset requires `ci-ok` plus CodeQL's two
  # `analyze` legs). Requiring each job -- and each matrix leg -- by name broke every time a job was renamed or
  # matrixed: the ruleset kept waiting for a context that no longer reported. With this gate the job layout above
  # can change freely; only a job added to `needs` below becomes required. `always()` so that a failed or
  # cancelled dependency still produces a (failing) `ci-ok` instead of a skipped one, which a ruleset would treat
  # as missing.
  ci-ok:
    if: always()
    needs: [ci, static, python, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required CI job did not succeed ($r)"; exit 1; }
          done
