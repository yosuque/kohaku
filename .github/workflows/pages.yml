name: Deploy Pages
# Manual only: neither Pages itself nor a scheduled/push trigger is enabled yet (see docs/user-guide.md §10).
# Approving this file does not deploy anything on its own — someone still has to dispatch it, and Pages
# still has to be turned on in the repo's own Settings first.
on:
  workflow_dispatch:
# Two dispatches in flight would race on the same GitHub Pages deployment; queue the second rather than
# cancel either one outright (a half-finished Pages deploy is worse than a short wait), matching GitHub's
# own documented Pages deployment template for this exact scenario.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No step here needs to act as the repository beyond reading it (build + copy + a local test run) —
    # narrower than the deploy job below on purpose.
    permissions:
      contents: read
    steps:
      # persist-credentials: false (unlike this repo's other checkout steps, e.g. ci.yml's — see zizmor's
      # `artipacked` finding): nothing after this step needs an authenticated git remote, so there is no
      # reason for the runner's git credential helper to keep the token around in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs site itself, based at /kohaku/ (this repo's GitHub Pages project-site path).
      - run: DOCS_BASE=/kohaku/ pnpm docs:build
      # The playground, based at /kohaku/playground/ (nested under the docs site's own base) rather than
      # its own default "/" — `pnpm exec` calls vite directly instead of going through the "build" script,
      # so `--base` reaches vite's CLI unambiguously (an npm/pnpm script's own `-- <args>` forwarding did
      # not reliably do this when tried locally). Still the same vite.config.ts, so forbidNodeBuiltins'
      # default strict mode still applies (KOHAKU_PLAYGROUND_AUDIT is unset) — this build fails outright if
      # any Node-only import is reachable from the bundle, exactly like the plain build in ci.yml.
      - run: pnpm --filter @kohaku-ui-sample/playground exec vite build --base=/kohaku/playground/
      - name: Copy the playground into the docs site's own dist, at /playground
        run: |
          mkdir -p apps/docs-site/dist/playground
          cp -r apps/playground/dist/. apps/docs-site/dist/playground/
      # Replays whatever fixtures actually ship with this build against a fresh host (no real LLM) — the
      # same check `ci.yml`'s non-blocking `playground-drift` job runs, but blocking here: a bad fixture is
      # something worth catching before it goes out under a real public URL, not just noting.
      - run: pnpm vitest run --project playground-drift
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs-site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Only what actions/deploy-pages itself needs (it does not check out the repository): the OIDC token to
    # authenticate the deployment (id-token) and permission to actually publish it (pages). No `contents`.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
