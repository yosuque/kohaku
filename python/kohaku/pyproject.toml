[project]
# Distribution name, not the import name: `kohaku` was already registered on PyPI by someone else,
# so the distribution is `kohaku-ui` (matching the npm scope) while the package still imports as
# `kohaku`. Installing is `pip install kohaku-ui`; using it is `import kohaku`.
name = "kohaku-ui"
version = "0.7.0"
description = "Python reference implementation of kohaku (Kohaku Protocol v0.1) — a generation/serving backend for declarative UI Specs"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "yosuque" }]
keywords = ["kohaku", "kohaku-ui", "generative-ui", "ui-spec", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
]

[project.optional-dependencies]
# The REST host (M5) / MCP host (M6) / LLM adapters (M3) are adopted incrementally.
rest = ["fastapi>=0.115", "uvicorn>=0.34"]
mcp = ["mcp>=2.2"]
llm = ["httpx>=0.28"]
# Native LLM adapters (other than OpenAI-compatible). Symmetric with the TS claude / gemini providers.
claude = ["anthropic>=1.5"]
gemini = ["google-genai>=1.0"]
# Ed25519 signing/verification for Compliance Evidence Packs (kohaku.lineage.evidence). Symmetric with
# the TS side's WebCrypto usage -- Python has no built-in Ed25519, so this is a real added dependency.
evidence = ["cryptography>=43"]
# Shared-backend StoragePort / CapabilityRevocationStore reference adapters (kohaku.storage.redis / .postgres),
# symmetric with the TS storage-redis / storage-postgres packages whose drivers are peers too. redis-py's asyncio
# client (`aclose()` needs >= 5.0.1) and psycopg 3 with its separate connection-pool distribution. psycopg needs
# libpq: install `psycopg[binary]` (or a system libpq) alongside -- the extra deliberately does not pick for you.
redis = ["redis>=5.2"]
postgres = ["psycopg[pool]>=3.2"]
# JWT / OIDC identity resolution (kohaku.authz_jwt). Symmetric with the TS side's `jose` dependency. The
# `crypto` extra is needed for the asymmetric algorithms a JWKS carries (RS256 / ES256 / EdDSA). Floor 2.14.0
# (released 2026-09-11, past ADR-0002's 7-day cooldown), per ADR-0002's security-fix exception. Per PyJWT's
# CHANGELOG: 2.13.0 made PyJWKClient refuse non-http(s) URIs and bound the token's header `alg` to a PyJWK's
# algorithm; 2.14.0 added the one this module depends on for a remote JWKS, PyJWKClient not following redirects
# (a redirect could hand the key fetch to another host), and also hardened HMAC-key validation. The advisory ids
# (GHSA-993g-76c3-p5m4, GHSA-jq35-7prp-9v3f, GHSA-9v7f-9g4p-ffgj) are as cited there; the advisories themselves
# were not opened. The unknown-`kid` cooldown and the cache are this module's own (identity.py), not PyJWKClient's.
jwt =["PyJWT[crypto]>=2.14.0"]
# Convenience bundle: every optional feature set, for demos and quickstarts that don't want to pick individually.
all = ["kohaku-ui[rest,mcp,llm,claude,gemini,evidence,jwt,redis,postgres]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kohaku"]

# The test suite reads spec/ from the monorepo root (see tests/conftest.py), so it cannot run from an
# sdist. Ship the importable package and its metadata only, rather than tests that cannot pass standalone.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[project.urls]
Homepage = "https://github.com/yosuque/kohaku"
Documentation = "https://github.com/yosuque/kohaku/blob/main/python/README.md"
Repository = "https://github.com/yosuque/kohaku"
Issues = "https://github.com/yosuque/kohaku/issues"
