# Python port of the kohaku sample sales domain (TS: the domain layer of apps/sample-api).
# REST/MCP host wiring lives elsewhere; this covers the domain, Intent catalog, and Port implementations.
[project]
name = "kohaku-sample-sales-api"
version = "0.0.0"
description = "kohaku sample: sales domain / Intent catalog / Port implementations (a port of the domain layer of TS apps/sample-api)"
requires-python = ">=3.12"
dependencies = ["kohaku-ui[rest,mcp]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_api"]

[tool.uv.sources]
kohaku-ui = { workspace = true }
